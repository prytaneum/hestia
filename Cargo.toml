[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.85"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
ipc = { path = "crates/ipc" }
common = { path = "crates/common" }
client = { path = "crates/client" }
engine = { path = "crates/engine" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ts-rs = "12.0.1"
thiserror = "2.0.18"
anyhow = "1.0.103"
async-trait = "0.1.92"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "fs", "signal", "process"] }
futures-util = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
flexi_logger = { version = "0.31.9", default-features = false, features = ["compress"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tui-markdown = { version = "0.3.8", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "form", "query", "multipart"] }
tray-icon = { version = "0.25.1", default-features = false }
tao = "0.37.1"
ksni = { version = "0.3.6", features = ["blocking"] }
png = "0.18.1"
image = { version = "0.25.8", default-features = false, features = ["png"] }
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4.46"
flate2 = "1.1.9"
fastnbt = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
uuid = { version = "1.23.4", features = ["v7"] }
junction = "2.1.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
discord-rich-presence = "1.1.0"
tempfile = "3.24.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
