[workspace]
resolver = "2"
members = ["crates/*"]
# Every member but `desktop`, which builds on its own through `cargo tauri`.
# Building or testing this set without `-p` keeps one feature resolution, so
# wasmtime and Cranelift compile once per profile rather than once per package
# selection.
default-members = [
    "crates/cli",
    "crates/client",
    "crates/common",
    "crates/daemon",
    "crates/engine",
    "crates/ipc",
    "crates/proto",
    "crates/sdk",
    "crates/tray",
]

[workspace.package]
version = "1.0.0-beta.3"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.85"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
ipc = { path = "crates/ipc" }
common = { path = "crates/common" }
client = { path = "crates/client" }
engine = { path = "crates/engine" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ts-rs = "12.0.1"
thiserror = "2.0.18"
anyhow = "1.0.103"
async-trait = "0.1.92"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "fs", "signal", "process"] }
futures-util = "0.3.32"
base64 = "0.23.1"
minisign = "0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
flexi_logger = { version = "0.31.9", default-features = false, features = ["compress"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tui-markdown = { version = "0.3.8", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "form", "query", "multipart"] }
tray-icon = { version = "0.26.1", default-features = false }
tao = "0.37.1"
ksni = { version = "0.3.6", features = ["blocking"] }
png = "0.18.1"
image = { version = "0.25.8", default-features = false, features = ["png"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4.46"
flate2 = "1.1.9"
fastnbt = "2.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
uuid = { version = "1.23.4", features = ["v4", "v7"] }
junction = "2.1.0"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
discord-rich-presence = "1.1.0"
tempfile = "3.24.0"
wasmtime = { version = "49.0.5", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "async", "pooling-allocator"] }
wasmtime-wasi = { version = "49.0.5", default-features = false, features = ["p2"] }
http = "1.4.0"
http-body-util = "0.1.3"
wasmtime-wasi-http = { version = "49.0.5", default-features = false, features = ["p2"] }

# Debug info stays in per-object `.dwo` files instead of being copied into
# every linked binary. Cargo drops it where rustc lacks support (Windows MSVC
# already writes a separate `.pdb`).
[profile.dev]
split-debuginfo = "unpacked"

# Dependencies keep file:line for backtraces; workspace crates keep full info.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
