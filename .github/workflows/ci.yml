name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"
  # release.yml calls this workflow as its gate, so a tag cannot publish
  # artifacts that never passed the same checks a branch push does.
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always
  # husky-rs installs the repo's git hooks from its build script; a CI checkout
  # has nothing to commit or push, so it has no use for them.
  NO_HUSKY_HOOKS: 1
  # Nothing here runs under a debugger: line tables keep a backtrace readable,
  # and dropping the rest shortens every compile, link and cache restore.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The plugin tests build example plugins into components.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude desktop --all-targets --features proto/ts -- -D warnings
      - name: test
        run: cargo test --workspace --exclude desktop
      - name: plugin API snapshot
        run: cargo test -p proto --features ts --test plugin_api
      - name: Generate the plugin template
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}
        run: cargo run --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p cli -- plugin new hello
      - name: Check out prytaneum/plugin-template
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v7
        with:
          repository: prytaneum/plugin-template
          path: plugin-template
      # Cargo.lock is the template's own: `plugin new` does not write one.
      - name: Diff the plugin template against `hestia plugin new`
        if: matrix.os == 'ubuntu-latest'
        run: diff -r -x .git -x Cargo.lock "$RUNNER_TEMP/hello" plugin-template

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install --frozen-lockfile
      # src/paraglide/ is generated and untracked, and the app imports from it,
      # so the messages compile before anything that resolves those imports.
      - name: generate messages
        run: bun run generate:messages
      - name: check
        run: bun run check
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun run test
      - name: build
        run: bun run build

  # `check` excludes the desktop crate so it needs no webview, which left the
  # Tauri shell's Rust unlinted everywhere. Compiling it is not free — it needs
  # the webview stack and `generate_context!` embeds frontend/dist — so it gets
  # its own job rather than slowing `check`.
  desktop:
    runs-on: ubuntu-latest
    env:
      # tauri-build asserts every `externalBin` exists on disk, though only the
      # bundler reads them and this job never bundles. Emptying the list saves
      # compiling the three sidecars just to satisfy that check.
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # generate_context! embeds the built frontend, so dist must exist before
      # the crate compiles. The paraglide plugin compiles messages during the
      # vite build, so this needs no separate generate:messages step.
      - name: Build the frontend
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build
      - name: clippy
        run: cargo clippy -p desktop --all-targets -- -D warnings
      - name: test
        run: cargo test -p desktop

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The published official index must verify against the keys this build
  # trusts, and must not be close to lapsing. The repository does not exist
  # until it is published, so a 404 is a notice, not a failure.
  official-index:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the official index
        id: fetch
        run: |
          base=https://raw.githubusercontent.com/prytaneum/plugins/repo
          mkdir -p "$RUNNER_TEMP/official"
          for file in plugins.json plugins.json.minisig; do
            status=$(curl -sS -o "$RUNNER_TEMP/official/$file" -w '%{http_code}' "$base/$file")
            if [ "$status" = 404 ]; then
              echo "::notice::the official repository is not published yet ($file is a 404)"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$status" = 200 ] || { echo "::error::$file answered HTTP $status"; exit 1; }
          done
          echo "published=true" >> "$GITHUB_OUTPUT"
      - if: steps.fetch.outputs.published == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - if: steps.fetch.outputs.published == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Verify it with this build's official keys
        if: steps.fetch.outputs.published == 'true'
        env:
          OFFICIAL_INDEX_DIR: ${{ runner.temp }}/official
        run: cargo test -p engine --test integration official -- --ignored
