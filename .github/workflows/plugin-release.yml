name: plugin-release

# Reusable: builds, signs and releases the one plugin a `<id>-v<version>` tag
# names, then refreshes the index with it. The caller job must grant
# `contents: write` and run on that tag.
on:
  workflow_call:
    inputs:
      hestia-ref:
        description: The Hestia ref the hestia CLI is installed from, as cargo reads a --rev (refs/heads/<branch>, refs/tags/<tag> or a commit)
        type: string
        required: true
    secrets:
      HESTIA_SIGNING_KEY:
        description: The unencrypted minisign secret key written by `hestia plugin keygen --unencrypted`
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Require the signing key
        env:
          HESTIA_SIGNING_KEY: ${{ secrets.HESTIA_SIGNING_KEY }}
        run: |
          [ -n "$HESTIA_SIGNING_KEY" ] || { echo "::error::HESTIA_SIGNING_KEY is not set"; exit 1; }
      - uses: actions/checkout@v7
      - name: Match the tag to the manifest
        run: |
          id="${TAG%-v*}"
          version="${TAG##*-v}"
          manifest="plugins/$id/plugin.toml"
          [ -f "$manifest" ] || { echo "::error::$TAG names no plugin: $manifest does not exist"; exit 1; }
          declared=$(grep -m1 '^version *=' "$manifest" | cut -d'"' -f2)
          [ "$declared" = "$version" ] || { echo "::error::$TAG, but $manifest declares version $declared"; exit 1; }
          echo "ID=$id" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install the hestia CLI
        env:
          HESTIA_REF: ${{ inputs.hestia-ref }}
        run: cargo install --locked --git https://github.com/prytaneum/hestia --rev "$HESTIA_REF" cli
      - name: Write the signing key
        env:
          HESTIA_SIGNING_KEY: ${{ secrets.HESTIA_SIGNING_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/hestia.key"
          printf '%s\n' "$HESTIA_SIGNING_KEY" > "$RUNNER_TEMP/hestia.key"
      - run: hestia plugin check
      - name: Test
        run: '[ ! -f "plugins/$ID/Cargo.toml" ] || cargo test -p "$ID"'
      - run: hestia plugin pack "$ID" --sign "$RUNNER_TEMP/hestia.key"
      - name: Publish the build
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$ID $VERSION" --notes ""
          gh release upload "$TAG" "dist/$ID-$VERSION.hplugin" "dist/$ID-$VERSION.hplugin.minisig"
      - name: Check out the default branch for the index
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: source
      - name: Fetch the current index
        run: |
          code=$(curl -sSL -o "$RUNNER_TEMP/previous.json" -w '%{http_code}' \
            "https://github.com/$GH_REPO/releases/download/hestia-index/hestia-index.json")
          case "$code" in
            200) echo "PREVIOUS=--previous $RUNNER_TEMP/previous.json" >> "$GITHUB_ENV" ;;
            404) echo "no previous index; this is the first run" ;;
            *) echo "::error::fetching the current index answered $code"; exit 1 ;;
          esac
      - name: Index
        working-directory: source
        run: hestia plugin index $PREVIOUS --add "$GITHUB_WORKSPACE/dist/$ID-$VERSION.hplugin" --repository "https://github.com/$GH_REPO" --sign "$RUNNER_TEMP/hestia.key"
      - name: Publish the index
        working-directory: source
        run: |
          gh release view hestia-index >/dev/null 2>&1 \
            || gh release create hestia-index --title "Hestia index" --notes "Regenerated on every push; do not edit." --latest=false
          gh release upload hestia-index dist/hestia-index.json dist/hestia-index.json.minisig --clobber
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hestia.key"
