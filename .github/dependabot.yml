version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: "/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      three:
        patterns: ["three", "@types/three"]
      bun:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
