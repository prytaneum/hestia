id = "tunnel-demo"
name = "Tunnel demo"
version = "0.1.0"
api = "^1.0.0"
wasm = "plugin.wasm"
description = "Runs a stand-in tunnel agent while a server is up, to show the process:spawn model."
permissions = ["process:read", "process:spawn"]

# A real tunnel would declare its agent here: `tailscale` on PATH, or
# `bin/playit` inside data/ with a sha256 per target. `sleep` stands in for it.
[[programs]]
id = "agent"
command = "sleep"
args = ["*"]

[contributes]
events = ["process.started", "process.exit"]
