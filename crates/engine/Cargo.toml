[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
# Integration tests are a separate crate, so cfg(test) cannot reach loopback;
# enabled only by the self dev-dependency below, never by a build that ships.
loopback = ["kernel/loopback"]

[dependencies]
hex = { workspace = true }
proto = { workspace = true }
common = { workspace = true }
kernel = { workspace = true, features = ["sandbox"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
fastnbt = { workspace = true }
zip = { workspace = true }
image = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
p256 = { version = "0.14.0", features = ["ecdsa"] }
getrandom = { workspace = true }
base64 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
engine = { path = ".", features = ["loopback"] }
tempfile.workspace = true
