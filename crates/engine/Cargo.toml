[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The portable archive carries its own data directory and is unpacked by hand,
# so it has no installer to update through.
portable = ["common/portable"]

[dependencies]
proto = { workspace = true }
common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
fastnbt = { workspace = true }
zip = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
p256 = { version = "0.14.0", features = ["ecdsa"] }
getrandom = "0.4"
base64 = "0.23.1"
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
