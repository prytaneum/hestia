[package]
name = "proto"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# The public suffix list, for refusing a network wildcard that would cover one.
# Host-side only: the plugin SDK builds `proto` without default features.
psl = { workspace = true, optional = true }
# Setting patterns, host-side only like `psl`.
regex = { workspace = true, optional = true }
# TypeScript codegen for the wire error surface; feature-gated so it never
# enters production builds. Regenerate with `scripts/gen-types.sh`.
ts-rs = { workspace = true, optional = true }

[features]
default = ["suffix", "pattern"]
suffix = ["dep:psl"]
pattern = ["dep:regex"]
ts = ["dep:ts-rs"]

[[test]]
name = "plugin_api"
required-features = ["ts"]
