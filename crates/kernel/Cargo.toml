[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Hosts::with_loopback`, for tests that serve files locally over plain http.
# No production code calls it; a build without the feature does not have it.
loopback = []
# `probe`, the test built-in that exposes a typed package. Integration tests are
# a separate crate, so cfg(test) cannot reach it; the self dev-dependency below
# turns it on for them.
probe = []

[dependencies]
proto = { workspace = true }
common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
wasmparser = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-http = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
psl = { workspace = true }
cap-std = { workspace = true }
minisign-verify = { workspace = true }
semver = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
kernel = { path = ".", features = ["probe", "loopback"] }
minisign = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
futures-util.workspace = true
tracing-subscriber.workspace = true
