[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["sandbox"]
# The registry, the WASM runtime and the network policy that serves them. The
# tooling that only reads packages (the CLI) builds without it, which keeps
# wasmtime out of `hestia`.
sandbox = [
    "dep:common",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:wasmtime-wasi-http",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:anyhow",
    "dep:reqwest",
    "dep:cap-std",
    "dep:hmac",
    "dep:getrandom",
    "dep:tokio",
    "dep:windows-sys",
]
# `Hosts::with_loopback`, for tests that serve files locally over plain http.
# No production code calls it; a build without the feature does not have it.
loopback = ["sandbox"]
# `probe`, the test built-in that exposes a typed package. Integration tests are
# a separate crate, so cfg(test) cannot reach it; the self dev-dependency below
# turns it on for them.
probe = ["sandbox"]

[dependencies]
base64 = { workspace = true }
hex = { workspace = true }
proto = { workspace = true }
common = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
wasmparser = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
psl = { workspace = true }
cap-std = { workspace = true, optional = true }
minisign-verify = { workspace = true }
semver = { workspace = true }
zip = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
kernel = { path = ".", features = ["probe", "loopback"] }
minisign = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
futures-util.workspace = true
wit-parser = { workspace = true }
tracing-subscriber.workspace = true
