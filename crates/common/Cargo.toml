[package]
name = "common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A build that carries its own data directory, for the portable archives. Off
# for anything an installer ships. See crates/common/src/paths.rs.
portable = []

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
flexi_logger = { workspace = true }
chrono = { workspace = true }

# husky-rs installs the repo's git hooks (.husky/) via its build script on
# `cargo test`. The virtual workspace has no root package to host it, so it lives
# on this foundational leaf crate, which every `cargo test` compiles.
[dev-dependencies]
husky-rs = "0.4.0"
serde_json = { workspace = true }
tempfile.workspace = true
