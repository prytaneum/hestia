[package]
name = "common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A build that carries its own data directory, for the portable archives. Off
# for anything an installer ships. See crates/common/src/paths.rs.
portable = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
flexi_logger = { workspace = true }
chrono = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# husky-rs installs the repo's git hooks (.husky/) via its build script on
# `cargo test`. The virtual workspace has no root package to host it, so it lives
# on this foundational leaf crate, which every `cargo test` compiles.
[dev-dependencies]
husky-rs = "0.4.0"
tempfile.workspace = true
