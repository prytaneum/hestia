[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop"
crate-type = ["rlib"]

[[bin]]
name = "hestia-desktop"
path = "src/main.rs"

[features]
# Build the portable archive's binaries: data lives inside the install.
portable = ["common/portable"]
# Serve the embedded frontend, not `devUrl`. `cargo tauri build` sets it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.4"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
client = { workspace = true }
common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the graph through wry; named here to reach the WebKit context.
webkit2gtk = { version = "2.0.2", features = ["v2_34"] }

[dev-dependencies]
tempfile.workspace = true
