[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates reached only through Tauri's own
# dependency tree, so there is nothing here for us to replace.
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error (tauri macro deps)
]

[licenses]
version = 2
allow = [
    # Hestia's own crates; the rest are dependency licenses.
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # A public-domain dedication: OSI-approved, FSF Free/Libre, and imposing
    # strictly less than the MIT terms already allowed above, so it carries
    # nothing into a GPL-3.0-only distribution (ksni, the tray's D-Bus stack).
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
